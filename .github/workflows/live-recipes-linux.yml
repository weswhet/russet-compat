name: Live recipes on Linux
# Runs the same live upstream recipes three ways on the same day: macOS with
# Apple's tools (the baseline), macOS with Russet's native replacements
# (RUSSET_NATIVE=all), and Linux. Then compares them, and checks the
# packages and disk images Linux built with Apple's tools.
on:
  workflow_dispatch:
    inputs:
      russet_ref:
        description: 'weswhet/russet branch, tag, or commit to build, package, and install (ignored when russet_release is set)'
        required: true
        type: string
        default: main
      russet_release:
        description: 'Published weswhet/russet release version to download and install instead of building, for example 0.0.1'
        required: false
        type: string
        default: ''
      recipe_ref:
        description: 'Exact autopkg/recipes commit to exercise'
        required: true
        type: string
        default: '0f7b61ab061c77710be4140c404910a11f89fc7b'
      recipe_set:
        description: 'Recipes to run: those that completed on macOS in evidence/live-recipes-2026-10-07.json, the full autopkg/recipes inventory, or the community sample in samples/org-recipes-2026-10-08.json (pinned repositories; ignores recipe_ref)'
        required: true
        type: choice
        options: ['macos-completed', 'all', 'org-sample']
        default: macos-completed
      recipe_paths:
        description: 'JSON array of exact recipe paths; overrides recipe_set when not []'
        required: true
        type: string
        default: '[]'
      authenticate_github:
        description: 'Use the workflow token for public GitHub API requests'
        required: true
        type: boolean
        default: true
      timeout:
        description: 'Timeout in seconds for each recipe'
        required: true
        type: string
        default: '600'
      shards:
        description: 'Linux shards, from 1 to 16'
        required: true
        type: string
        default: '14'
      macos_runs:
        description: 'Recipes to run on macOS, with Apple tools and natively: only those that fail on Linux, or every selected recipe'
        required: true
        type: choice
        options: ['linux-failures', 'all']
        default: linux-failures
permissions:
  contents: read
jobs:
  select:
    name: Select recipes
    runs-on: ubuntu-24.04
    outputs:
      paths: ${{ steps.select.outputs.paths }}
      shards: ${{ steps.select.outputs.shards }}
      shard_count: ${{ steps.select.outputs.shard_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: select
        env:
          RECIPE_SET: ${{ inputs.recipe_set }}
          RECIPE_PATHS: ${{ inputs.recipe_paths }}
          SHARDS: ${{ inputs.shards }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          paths = json.loads(os.environ['RECIPE_PATHS'])
          if not isinstance(paths, list) or not all(isinstance(p, str) for p in paths):
              raise ValueError('recipe_paths must be a JSON array of strings')
          shards = int(os.environ['SHARDS'])
          if not 1 <= shards <= 16:
              raise ValueError('shards must be from 1 to 16')
          if not paths and os.environ['RECIPE_SET'] == 'macos-completed':
              evidence = json.load(open('evidence/live-recipes-2026-10-07.json'))
              paths = [r['recipe'] for r in evidence['recipes'] if r['final']['status'] == 'passed']
          if not paths and os.environ['RECIPE_SET'] == 'org-sample':
              paths = json.load(open('samples/org-recipes-2026-10-08.json'))['recipes']
          print(f'{len(paths) or "all"} recipes selected')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('paths=' + json.dumps(paths) + '\n')
              output.write('shards=' + json.dumps(list(range(shards))) + '\n')
              output.write(f'shard_count={shards}\n')
          PYTHON
  linux:
    name: linux
    needs: select
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    uses: ./.github/workflows/live-recipe-shard.yml
    with:
      leg: linux
      os: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      shard: ${{ matrix.shard }}
      shards: ${{ needs.select.outputs.shard_count }}
      recipe_paths: ${{ needs.select.outputs.paths }}
      recipe_set: ${{ inputs.recipe_set }}
      recipe_ref: ${{ inputs.recipe_ref }}
      russet_ref: ${{ inputs.russet_ref }}
      russet_release: ${{ inputs.russet_release }}
      authenticate_github: ${{ inputs.authenticate_github }}
      timeout: ${{ inputs.timeout }}
  # macOS runs only what it needs to: every recipe when macos_runs is all,
  # otherwise just the recipes that failed on Linux, to tell Russet bugs from
  # recipes that fail with Apple's tools too.
  triage:
    name: Choose recipes for macOS
    needs: [select, linux]
    if: always() && needs.select.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      paths: ${{ steps.choose.outputs.paths }}
      shards: ${{ steps.choose.outputs.shards }}
      shard_count: ${{ steps.choose.outputs.shard_count }}
      count: ${{ steps.choose.outputs.count }}
    steps:
      - uses: actions/download-artifact@v7
        if: inputs.macos_runs == 'linux-failures'
        with:
          pattern: live-linux-*
          path: ${{ runner.temp }}/linux
      - id: choose
        env:
          MACOS_RUNS: ${{ inputs.macos_runs }}
          SELECTED: ${{ needs.select.outputs.paths }}
        run: |
          python3 - <<'PYTHON'
          import json, math, os, pathlib
          if os.environ['MACOS_RUNS'] == 'all':
              paths = json.loads(os.environ['SELECTED'])
              count = len(paths) or 'all'
              shards = 4
          else:
              paths = []
              for summary in sorted(pathlib.Path(os.environ['RUNNER_TEMP'], 'linux').rglob('summary.json')):
                  for result in json.loads(summary.read_text())['results']:
                      # A macOS-only operation needs no baseline to excuse it.
                      if result['status'] != 'passed' and result['diagnostic_category'] != 'unsupported_platform':
                          paths.append(result['path'])
              count = len(paths)
              shards = min(5, max(1, math.ceil(count / 12)))
          print(f'{count} recipes for macOS in {shards} shards per leg')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('paths=' + json.dumps(sorted(paths)) + '\n')
              output.write('shards=' + json.dumps(list(range(shards))) + '\n')
              output.write(f'shard_count={shards}\ncount={count}\n')
          PYTHON
  macos:
    name: ${{ matrix.leg }}
    needs: triage
    if: always() && needs.triage.result == 'success' && needs.triage.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        leg: [apple, native]
        shard: ${{ fromJSON(needs.triage.outputs.shards) }}
        include:
          - leg: apple
            native: ''
          - leg: native
            native: all
    uses: ./.github/workflows/live-recipe-shard.yml
    with:
      leg: ${{ matrix.leg }}
      os: macos-15
      target: aarch64-apple-darwin
      native: ${{ matrix.native }}
      shard: ${{ matrix.shard }}
      shards: ${{ needs.triage.outputs.shard_count }}
      recipe_paths: ${{ needs.triage.outputs.paths }}
      recipe_set: ${{ inputs.recipe_set }}
      recipe_ref: ${{ inputs.recipe_ref }}
      russet_ref: ${{ inputs.russet_ref }}
      russet_release: ${{ inputs.russet_release }}
      authenticate_github: ${{ inputs.authenticate_github }}
      timeout: ${{ inputs.timeout }}
  compare:
    name: Compare legs
    needs: [linux, macos]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: live-*
          path: ${{ runner.temp }}/evidence
      - name: Compare macOS (Apple tools), macOS (native), and Linux
        env:
          MACOS_RUNS: ${{ inputs.macos_runs }}
        run: |
          e="$RUNNER_TEMP/evidence"
          mkdir -p "$e/apple" "$e/native" "$e/linux"
          for leg in apple native linux; do
            for d in "$e"/live-$leg-*; do [ -e "$d" ] && mv "$d" "$e/$leg/"; done
          done
          python3 Scripts/compare_live_legs.py --apple "$e/apple" --native "$e/native" --linux "$e/linux" \
            --macos-runs "$MACOS_RUNS" \
            --output "$RUNNER_TEMP/comparison.json" --markdown "$RUNNER_TEMP/comparison.md"
      - if: always()
        run: cat "$RUNNER_TEMP/comparison.md" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comparison
          path: |
            ${{ runner.temp }}/comparison.json
            ${{ runner.temp }}/comparison.md
  verify-linux-outputs:
    name: Check Linux-built outputs with Apple's tools
    needs: linux
    if: always()
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: built-outputs-*
          path: ${{ runner.temp }}/built-outputs
      - run: python3 Scripts/verify_linux_outputs.py "$RUNNER_TEMP/built-outputs" --report "$RUNNER_TEMP/verify-outputs.json"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-linux-outputs
          path: ${{ runner.temp }}/verify-outputs.json
          if-no-files-found: warn
